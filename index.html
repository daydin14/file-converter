<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convert images, PDFs, and spreadsheets in your browser. Files never leave your device."
    />
    <meta name="theme-color" content="#f4efe6" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>Dave's File Converter</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('file-converter-theme')
          var theme =
            stored === 'ink' || stored === 'paper'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'ink'
                : 'paper'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme === 'ink' ? 'dark' : 'light'
        } catch (error) {
          /* keep the default theme */
        }
      })()
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
